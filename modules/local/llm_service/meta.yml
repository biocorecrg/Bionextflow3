name: "llm_service"
description: "Send JSON metrics (e.g. bcl2fastq demultiplexing Stats.json) to an LLM web service for diagnosis, summarization, and reporting"
keywords:
  - llm
  - qc
  - demultiplexing
  - bcl2fastq
  - reporting
  - web service
tools:
  - "python":
      description: "Standard Python urllib client calling an OpenAI-compatible / LLM web service endpoint"
      homepage: "https://www.python.org"
      documentation: "https://docs.python.org/3/"
      licence: ["PSF-2.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample/run information
          e.g. [ id:'test' ]
    - json_file:
        type: file
        description: Input JSON file (e.g. Stats.json from bcl2fastq)
        pattern: "*.json"
  - - system_prompt:
        type: file
        description: Optional system prompt file providing role and instructions to the LLM
  - - user_prompt:
        type: file
        description: Optional user prompt template file preceding the JSON content

output:
  - report:
      - meta:
          type: map
          description: Groovy Map containing sample/run information
      - "${prefix}_llm_report.md":
          type: file
          description: Markdown report generated by the LLM
          pattern: "*_llm_report.md"
  - json:
      - meta:
          type: map
          description: Groovy Map containing sample/run information
      - "${prefix}_llm_response.json":
          type: file
          description: Raw JSON response received from the LLM web service
          pattern: "*_llm_response.json"
  - mqc_html:
      - meta:
          type: map
          description: Groovy Map containing sample/run information
      - "${prefix}_demux_llm_mqc.html":
          type: file
          description: MultiQC custom content HTML section for demultiplexing LLM evaluation
          pattern: "*_demux_llm_mqc.html"
  - versions:
      - versions:
          type: file
          description: File containing software versions

authors:
  - "@biocorecrg"
  - "@lucacozzuto"
